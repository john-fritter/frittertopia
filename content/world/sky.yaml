entities:
  - key: world.sky
    components:
      SkyDescriptions:
        brackets:
          deep_night:
            sky: >-
              The sky is black and absolute, stars scattered in hard points
              across the vault overhead.
            window: "darkness"
            sound: "Silence outside, deep and total."
            moon:
              new: ""
              waxing_crescent: >-
                A thin crescent moon hangs low, barely a scratch of light.
              first_quarter: >-
                A half moon rides the sky, its light faint but present.
              waxing_gibbous: >-
                A gibbous moon throws pale light across the ground, bright
                enough to cast faint shadows.
              full: >-
                The full moon floods the world with cold white light, sharp
                enough to read by.
              waning_gibbous: >-
                A gibbous moon throws pale light across the ground, bright
                enough to cast faint shadows.
              third_quarter: >-
                A half moon rides the sky, its light faint but present.
              waning_crescent: >-
                A thin crescent moon hangs low, barely a scratch of light.
          night:
            sky: >-
              The sky is dark, though a band of deep blue still clings to the
              western horizon.
            window: "near-darkness"
            sound: ""
            moon:
              new: ""
              waxing_crescent: >-
                A sliver of moon cuts a thin line above the trees.
              first_quarter: >-
                A half moon hangs overhead, its light thin and silver.
              waxing_gibbous: >-
                A bright gibbous moon washes the landscape in pale grey.
              full: >-
                The full moon stands high and brilliant, turning the world to
                silver and shadow.
              waning_gibbous: >-
                A bright gibbous moon washes the landscape in pale grey.
              third_quarter: >-
                A half moon hangs overhead, its light thin and silver.
              waning_crescent: >-
                A sliver of moon cuts a thin line above the trees.
          dawn:
            sky: >-
              The eastern sky brightens to a pale steel, the stars fading one
              by one. The horizon is a line of cold fire.
            window: "the grey of early dawn"
            sound: "A bird calls once, somewhere distant."
          morning:
            sky: >-
              The sun is up, low and golden, throwing long shadows across the
              ground. The sky is clear and pale.
            window: "warm morning light"
            sound: "Birdsong drifts in from outside."
          midday:
            sky: >-
              The sun is high and the sky is a hard blue. Heat shimmers above
              the stone.
            window: "bright midday light"
            sound: "Insects drone faintly in the heat."
          afternoon:
            sky: >-
              The sun has crossed its peak and the light has turned long and
              amber. Shadows stretch east.
            window: "the slanting light of afternoon"
            sound: ""
          dusk:
            sky: >-
              The sun sits on the western horizon, swollen and red. The sky
              above deepens to violet.
            window: "fading amber light"
            sound: ""
          evening:
            sky: >-
              The sky is a deep bruised blue, the last light gone from the
              west. The first stars are out.
            window: "near-darkness"
            sound: "Crickets have started up outside."
            moon:
              new: ""
              waxing_crescent: >-
                A thin crescent moon glows low in the west.
              first_quarter: >-
                A half moon stands in the darkening sky.
              waxing_gibbous: >-
                A gibbous moon brightens as the sky darkens around it.
              full: >-
                The full moon rises in the east, enormous and pale.
              waning_gibbous: >-
                A gibbous moon brightens as the sky darkens around it.
              third_quarter: >-
                A half moon stands in the darkening sky.
              waning_crescent: >-
                A thin crescent moon glows low in the west.
