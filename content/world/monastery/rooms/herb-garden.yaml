entities:
  - key: monastery.garden
    components:
      Room:
        name: "The Herb Garden"
      Description:
        short: "an overgrown walled garden"
      RoomProse:
        prose: |
          A small walled garden on the south side of the monastery, sheltered from the worst of the mountain wind but open to the sky. The walls are old stone, chest-high, capped with flat slabs that have shifted and cracked over the years. In places the mortar has crumbled entirely and the stones are held in place by the roots that have grown between them. The garden is maybe twenty feet square — intimate, enclosed, a room without a roof.

          [beds] Four raised beds of dark earth, edged with rough-cut stone, arranged in a simple grid with gravel paths between them. The beds were once orderly rows of culinary and medicinal herbs, and the bones of that order are still visible — sage in one bed, lavender in another — but everything has grown past its boundaries. The sage is woody and sprawling. The lavender has gone leggy, falling over the stone edges. A few beds show signs of recent tending — pulled weeds piled at the edges, soil turned dark where someone has been working — but the garden is winning. (The garden is tended but not controlled. Someone cares for it but can't keep up. Describe it as alive and a little wild, not abandoned.)

          [rosemary] A rosemary bush in the southwest corner that has grown far past anything intentional. It's waist-high and wider than it is tall, with thick woody stems at the base and fragrant green growth at the tips. It has essentially colonized its corner of the garden, pushing branches across the gravel path and up against the wall. Brushing against it releases a sharp, clean scent that lingers on clothing. In spring it puts out pale blue flowers. (The rosemary is the dominant feature of the garden by sheer presence. It should be mentioned in any description. It's been growing here for a very long time.)

          [brambles] Wild brambles have crept in from outside the walls in the northeast corner, thorny runners threading through the stone gaps. They've been cut back recently — the cut ends are pale and fresh — but new growth is already reaching. In summer and autumn they carry small dark berries, tart and worth the scratches. (The brambles are not cultivated. They're an intrusion the monks tolerate because the berries are useful.)

          The gravel paths between the beds are uneven, half-buried in places by soil that's washed out of the beds or by the herbs themselves spreading. The gravel is pale against the dark earth. In the morning the garden is cool and dewy, the herbs at their most fragrant — the air is dense with scent. By midday the sun bakes the garden and the smell turns dry and resinous. In the evening the stone walls radiate stored heat and the garden is the warmest outdoor space in the monastery. At night the garden smells of damp earth and cooling stone. (The garden's character changes dramatically with time of day. The smells and the quality of the air are the most important sensory details here.)

          The east wall has a low passage back into the kitchen — a dark rectangle in the stone, with light and cooking-smell spilling out. The threshold is worn smooth and there's always a little drift of soil tracked back and forth.

          Exits: East to the kitchen.

      RoomBrief:
        brief: |
          Roughly square walled garden on the south side of the monastery, approximately twenty feet across. Stone walls are chest-high, capped with flat slabs shifted and cracked. Mortar has crumbled in places; roots grow between stones and hold them. Open to sky, sheltered from the worst mountain wind.

          Morning is cool and dewy, with herb scent at its strongest. Midday sun bakes the garden and turns the smell dry and resinous. Evening stone walls radiate stored heat, making this the warmest outdoor space in the monastery. At night the strongest scents are damp earth and cooling stone.

          [beds] {
            Four raised beds of dark earth edged with rough-cut stone, arranged in a simple grid with gravel paths running north-south and east-west between them.
            Each bed is approximately four feet square, with stone edges about one foot high. Sage fills one bed; lavender fills another. Both have grown past their boundaries. Some beds show recent tending: pulled weeds piled at edges, soil turned dark. Gravel paths are uneven and half-buried by soil wash and spreading herbs.
          }

          [rosemary] {
            Rosemary bush in the southwest corner of the garden.
            Waist-high and wider than tall, about five feet across, with thick woody stems at the base and fragrant green growth at the tips. Branches spread across the gravel path and press against the wall. Brushing it releases a sharp clean scent that lingers on clothing.
            REVEAL: pale blue flowers — spring
          }

          [brambles] {
            Wild brambles in the northeast corner of the garden, creeping in from gaps in the outside wall.
            Thorny runners spread roughly six feet along the wall and two feet into the garden. Cut ends are pale and fresh; new growth is already reaching. They are not cultivated.
            REVEAL: small dark berries, tart — summer and autumn
          }
      WeatherZoneRef:
        zoneId: weather.zone.monastery
      Exits:
        exits:
          east: monastery.kitchen
