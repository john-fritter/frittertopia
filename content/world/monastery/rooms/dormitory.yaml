entities:
  - key: monastery.dormitory
    components:
      Room:
        name: "The Dormitory"
      Description:
        short: "a long, spare dormitory"
      RoomProse:
        prose: |
          A long, low-ceilinged room that runs along the east wall of the monastery. The ceiling is close — rough-hewn beams with the bark still on in places, dark with age. The room is austere by design, not poverty. Everything here exists because it was deemed necessary, and nothing else was.

          [cots] Eight narrow cots arranged in a row along the north wall, each identical: a wooden frame, a thin straw mattress, a single wool blanket folded with tight corners. The frames are old but well-maintained — someone has replaced joints and tightened pegs over the years. The blankets are coarse grey wool, heavy and warm, each one slightly different in its wear. A few mattresses show the shapes of their occupants — faint impressions that haven't quite sprung back. (Not all the cots are in use. Describe some as clearly unslept-in — blankets too perfect, no impression in the mattress. The room was built for more people than currently live here. Don't state this directly.)

          [window] A single shuttered window at the far east end. The shutters are heavy wood, swollen slightly with moisture, and don't close perfectly — a thin line of light or dark always leaks through. When open, the window looks east down the mountain. In the morning, direct light floods the room in a single bright shaft. By midday the light has moved on and the room falls into a cool dimness. In the evening the window frames the darkening sky. At night, with the shutters closed, the room is very dark. (This window is the room's only light source. The quality of light — or its absence — defines the room's mood entirely. Match to time of day.)

          The floor is bare stone, cold underfoot, swept clean. There's a faint smell of wool, old wood, and the particular mineral cold of stone that never fully warms. The room is quiet in a way that's different from the chapel's silence — this is the quiet of people sleeping, or of a room waiting for people to sleep. Sound carries from the corridor through the door but arrives muted, as though the thick walls absorb it.

          [pegs] A row of wooden pegs driven into the south wall, one beside each cot. Most are empty. One holds a rough linen robe. Another has a leather cord with a few wooden beads. (These are the only personal storage in the room. The emptiness of most pegs reinforces how little the monks own.)

          The door to the west is heavy dark wood, slightly crooked in its stone frame — it scrapes the floor when opened or closed, and the sound carries through the dormitory. There's a groove worn into the stone where it drags.

          Exits: West to the corridor.

      RoomBrief:
        brief: |
          Rectangular dormitory running east-west along the monastery's east wall. Approximately forty feet long, sixteen feet wide, and nine feet high at the ceiling peak. Rough-hewn beams with bark intact are darkened with age. Bare flagstone floor is cold and swept clean. Faint smell of wool, old wood, and mineral stone-cold. Sound from the corridor arrives muted through thick walls.

          Stone floor never fully warms. The room changes sharply with window state and time of day.

          [cots] {
            Eight wooden-frame cots with straw mattresses and coarse grey wool blankets, arranged in a single row along the north wall.
            Each frame is approximately three feet wide and six feet long, evenly spaced with narrow gaps between. Frames are old, with joints recently re-tightened and pegged. Blankets are folded with tight corners. Several mattresses show faint body impressions; several remain untouched.
          }

          [window] {
            Single shuttered opening at the far east end of the room, looking down the mountain's eastern slope.
            Opening is roughly three feet wide and four feet tall. Heavy wooden shutters are swollen slightly with moisture and do not close perfectly, leaving a thin line at the edges. Morning light enters as a direct bright shaft from east to west. By midday the room falls into cool dimness. In evening the window frames darkening sky. With shutters closed at night, the room is very dark.
          }

          [pegs] {
            Wooden pegs driven into the south wall at regular intervals, one beside each cot.
            Each peg is about six inches long, set at shoulder height. Most are empty. One holds a rough linen robe. One holds a leather cord with a few wooden beads.
          }
      Exits:
        exits:
          west: monastery.corridor
